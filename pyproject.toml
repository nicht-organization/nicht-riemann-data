[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nicht-riemann-data"
version = "0.1.0"
description = "Reproducible empirical toolkit for Riemann zeta zero data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24"
]

[tool.setuptools.packages.find]
where = ["src"]
